name: Build Podium Air Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build in Premiere-Pro-IDE
    uses: kaizen-flims/Premiere-Pro-IDE/.github/workflows/build-android.yml@main
    secrets:
      PODIUM_RELEASE_KEYSTORE_BASE64: ${{ secrets.PODIUM_RELEASE_KEYSTORE_BASE64 }}
      PODIUM_RELEASE_STORE_PASSWORD: ${{ secrets.PODIUM_RELEASE_STORE_PASSWORD }}
      PODIUM_RELEASE_KEY_ALIAS: ${{ secrets.PODIUM_RELEASE_KEY_ALIAS }}
      PODIUM_RELEASE_KEY_PASSWORD: ${{ secrets.PODIUM_RELEASE_KEY_PASSWORD }}
