name: Podium Air Audit 3

on:
  push:
    branches:
      - "audit3/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podium-air-audit3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-audit3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Restore dedicated Audit 3 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/podium-air-audit3.keystore
          key: podium-air-android-audit3-signing-v1

      - name: Create Audit 3 signing key if this is the first build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/podium-air-audit3.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/podium-air-audit3.keystore" \
              -storepass android -keypass android -alias podiumaudit3 \
              -dname "CN=Podium Air Audit 3, O=Podium, C=IN" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -exportcert -keystore "$HOME/.android/podium-air-audit3.keystore" \
            -storepass android -alias podiumaudit3 > audit3-certificate.der
          sha256sum audit3-certificate.der | cut -d ' ' -f 1 > audit3-certificate.sha256
          if grep -Fxq "$(cat audit3-certificate.sha256)" <(printf '%s\n' \
            f54546718dc928e7d68d745cff4741c8a64f088564cd35c515a81d870c94a9ac \
            fecd7966b7cff88be9aeb7be70bfc10b588d43569c8bf25c447dd4ae4d1d95a2); then
            echo "Audit 3 key must be distinct from Audit 2 and production"
            exit 1
          fi

      - name: Run Android unit tests
        run: bash gradlew :app:testDevDebugUnitTest --no-daemon --no-parallel --max-workers=1 --stacktrace

      - name: Build isolated Audit 3 APK
        run: >-
          bash gradlew :app:assembleProdAudit3 --no-daemon --no-parallel --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true'
          --stacktrace

      - name: Verify Audit 3 package and signing identity
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          aapt="$(dirname "$apksigner")/aapt"
          apk="$(find app/build/outputs/apk/prod/audit3 -name '*universal*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p dist/android-audit3
          cp "$apk" dist/android-audit3/Podium-Air-Audit-3-v1.9.1-ui.apk
          "$aapt" dump badging "$apk" | tee dist/android-audit3/audit3-apk-badging.txt
          "$apksigner" verify --print-certs "$apk" | tee dist/android-audit3/audit3-signing-verification.txt
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > dist/android-audit3/audit3-manifest.txt
          grep -Fq "package: name='com.podium.air.audit3'" dist/android-audit3/audit3-apk-badging.txt
          grep -Fq "application-label:'Podium Air Audit 3'" dist/android-audit3/audit3-apk-badging.txt
          grep -Fqi "$(cat audit3-certificate.sha256)" dist/android-audit3/audit3-signing-verification.txt
          if grep -Fqi 'f54546718dc928e7d68d745cff4741c8a64f088564cd35c515a81d870c94a9ac' dist/android-audit3/audit3-signing-verification.txt; then
            echo 'Audit 3 must not use Audit 2 signing certificate'
            exit 1
          fi
          if grep -Fqi 'fecd7966b7cff88be9aeb7be70bfc10b588d43569c8bf25c447dd4ae4d1d95a2' dist/android-audit3/audit3-signing-verification.txt; then
            echo 'Audit 3 must not use production signing certificate'
            exit 1
          fi
          grep -Fq 'com.podium.air.audit3.fileprovider' dist/android-audit3/audit3-manifest.txt
          sha256sum dist/android-audit3/*.apk > dist/android-audit3/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-audit3-android
          path: dist/android-audit3/
          if-no-files-found: error
