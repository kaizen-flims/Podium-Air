name: Android CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build installable Podium Air debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            ./gradlew assembleProdDebug
          else
            ./gradlew assembleDevDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-debug
          path: app/build/outputs/apk/*/debug/*.apk

  build-signed-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Build signed release with Podium Air key
        env:
          PODIUM_AIR_KEYSTORE_BASE64: ${{ secrets.PODIUM_AIR_KEYSTORE_BASE64 }}
          PODIUM_AIR_KEYSTORE_PASSWORD: ${{ secrets.PODIUM_AIR_KEYSTORE_PASSWORD }}
          PODIUM_AIR_KEY_ALIAS: ${{ secrets.PODIUM_AIR_KEY_ALIAS }}
          PODIUM_AIR_KEY_PASSWORD: ${{ secrets.PODIUM_AIR_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$PODIUM_AIR_KEYSTORE_BASE64" || { echo 'Missing Podium Air signing secrets'; exit 1; }
          test -n "$PODIUM_AIR_KEYSTORE_PASSWORD"
          test -n "$PODIUM_AIR_KEY_ALIAS"
          test -n "$PODIUM_AIR_KEY_PASSWORD"
          # Accept either the value alone or a copied NAME=VALUE line, including
          # whitespace inserted by a phone's text viewer when selecting it.
          keystore_base64="${PODIUM_AIR_KEYSTORE_BASE64#PODIUM_AIR_KEYSTORE_BASE64=}"
          echo "Encoded signing key length: ${#keystore_base64} characters"
          printf '%s' "$keystore_base64" | tr -d '[:space:]' | base64 -d > podium-air-release.jks
          test "$(sha256sum podium-air-release.jks | cut -d ' ' -f 1)" = '0c2d187c0d8e441cac891ecc69ee18a9f69676e1651d172a3db3c307380b6bcf' || { echo 'Signing key contents do not match the Podium Air release key'; exit 1; }
          chmod 600 podium-air-release.jks
          store_password="${PODIUM_AIR_KEYSTORE_PASSWORD#PODIUM_AIR_KEYSTORE_PASSWORD=}"
          key_alias="${PODIUM_AIR_KEY_ALIAS#PODIUM_AIR_KEY_ALIAS=}"
          key_password="${PODIUM_AIR_KEY_PASSWORD#PODIUM_AIR_KEY_PASSWORD=}"
          {
            echo 'storeFile=podium-air-release.jks'
            printf 'storePassword=%s\n' "$store_password"
            printf 'keyAlias=%s\n' "$key_alias"
            printf 'keyPassword=%s\n' "$key_password"
          } > keystore.properties
          chmod 600 keystore.properties
          chmod +x gradlew
          ./gradlew assembleProdRelease
      - name: Verify and name the universal signed APK
        shell: bash
        run: |
          set -euo pipefail
          echo 'Release APK outputs:'
          find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort
          shopt -s nullglob
          apks=(app/build/outputs/apk/prod/release/*universal*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one universal APK; found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" Podium-Air-v1.0.1.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner" || { echo 'Android apksigner is missing'; exit 1; }
          "$apksigner" verify --print-certs Podium-Air-v1.0.1.apk | tee signing-verification.txt
          grep -Fqi 'certificate SHA-256 digest: fecd7966b7cff88be9aeb7be70bfc10b588d43569c8bf25c447dd4ae4d1d95a2' signing-verification.txt || { echo 'Release certificate fingerprint mismatch'; exit 1; }
          aapt="$(dirname "$apksigner")/aapt"
          "$aapt" dump badging Podium-Air-v1.0.1.apk > apk-badging.txt
          grep '^package: ' apk-badging.txt
          grep -Fq "package: name='com.podium.air' versionCode='2' versionName='1.0.1'" apk-badging.txt || { echo 'Release app ID or version mismatch'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-release-signed
          path: Podium-Air-v1.0.1.apk
          if-no-files-found: error
      - name: Publish Podium Air v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo 'Release v1.0.1 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.0.1 Podium-Air-v1.0.1.apk \
            --target "$GITHUB_SHA" \
            --title 'Podium Air v1.0.1' \
            --notes 'Podium Air v1.0.1 is a signed update for v1.0.0 with the same app ID and release key. It adjusts the launcher icon size, adds the monochrome Home mark, and refines the Settings and account selector credits. Install Podium-Air-v1.0.1.apk over the existing app to retain its data. Source, upstream credits, and GPLv3 notices are in this repository.'
