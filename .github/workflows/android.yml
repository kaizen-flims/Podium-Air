name: Android CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-debug:
    concurrency:
      group: podium-debug-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build installable Podium Air debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          chmod +x gradlew
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            ./gradlew assembleProdDebug
          else
            ./gradlew assembleDevDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-debug
          path: app/build/outputs/apk/*/debug/*.apk

  build-signed-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Build signed release with Podium Air key
        env:
          PODIUM_AIR_KEYSTORE_BASE64: ${{ secrets.PODIUM_AIR_KEYSTORE_BASE64 }}
          PODIUM_AIR_KEYSTORE_PASSWORD: ${{ secrets.PODIUM_AIR_KEYSTORE_PASSWORD }}
          PODIUM_AIR_KEY_ALIAS: ${{ secrets.PODIUM_AIR_KEY_ALIAS }}
          PODIUM_AIR_KEY_PASSWORD: ${{ secrets.PODIUM_AIR_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$PODIUM_AIR_KEYSTORE_BASE64" || { echo 'Missing Podium Air signing secrets'; exit 1; }
          test -n "$PODIUM_AIR_KEYSTORE_PASSWORD"
          test -n "$PODIUM_AIR_KEY_ALIAS"
          test -n "$PODIUM_AIR_KEY_PASSWORD"
          # Accept either the value alone or a copied NAME=VALUE line, including
          # whitespace inserted by a phone's text viewer when selecting it.
          keystore_base64="${PODIUM_AIR_KEYSTORE_BASE64#PODIUM_AIR_KEYSTORE_BASE64=}"
          echo "Encoded signing key length: ${#keystore_base64} characters"
          printf '%s' "$keystore_base64" | tr -d '[:space:]' | base64 -d > podium-air-release.jks
          test "$(sha256sum podium-air-release.jks | cut -d ' ' -f 1)" = '0c2d187c0d8e441cac891ecc69ee18a9f69676e1651d172a3db3c307380b6bcf' || { echo 'Signing key contents do not match the Podium Air release key'; exit 1; }
          chmod 600 podium-air-release.jks
          store_password="${PODIUM_AIR_KEYSTORE_PASSWORD#PODIUM_AIR_KEYSTORE_PASSWORD=}"
          key_alias="${PODIUM_AIR_KEY_ALIAS#PODIUM_AIR_KEY_ALIAS=}"
          key_password="${PODIUM_AIR_KEY_PASSWORD#PODIUM_AIR_KEY_PASSWORD=}"
          {
            echo 'storeFile=podium-air-release.jks'
            printf 'storePassword=%s\n' "$store_password"
            printf 'keyAlias=%s\n' "$key_alias"
            printf 'keyPassword=%s\n' "$key_password"
          } > keystore.properties
          chmod 600 keystore.properties
          chmod +x gradlew
          ./gradlew assembleProdRelease
      - name: Verify and name the universal signed APK
        shell: bash
        run: |
          set -euo pipefail
          echo 'Release APK outputs:'
          find app/build/outputs/apk/prod/release -maxdepth 1 -type f -name '*.apk' -printf '%f\n' | sort
          shopt -s nullglob
          apks=(app/build/outputs/apk/prod/release/*universal*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one universal APK; found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" Podium-Air-v1.0.2.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner" || { echo 'Android apksigner is missing'; exit 1; }
          "$apksigner" verify --print-certs Podium-Air-v1.0.2.apk | tee signing-verification.txt
          grep -Fqi 'certificate SHA-256 digest: fecd7966b7cff88be9aeb7be70bfc10b588d43569c8bf25c447dd4ae4d1d95a2' signing-verification.txt || { echo 'Release certificate fingerprint mismatch'; exit 1; }
          aapt="$(dirname "$apksigner")/aapt"
          "$aapt" dump badging Podium-Air-v1.0.2.apk > apk-badging.txt
          grep '^package: ' apk-badging.txt
          grep -Fq "package: name='com.podium.air' versionCode='3' versionName='1.0.2'" apk-badging.txt || { echo 'Release app ID or version mismatch'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-release-signed
          path: Podium-Air-v1.0.2.apk
          if-no-files-found: error
      - name: Publish Podium Air v1.0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view v1.0.2 >/dev/null 2>&1; then
            echo 'Release v1.0.2 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.0.2 Podium-Air-v1.0.2.apk \
            --target "$GITHUB_SHA" \
            --title 'Podium Air v1.0.2 — Android' --latest \
            --notes 'Podium Air v1.0.2 integrates upstream shared playback, queue, cache, lyrics and Automix improvements, Spotify library/import and download-cookie isolation. Prem completed personal Android testing. This APK uses the existing com.podium.air ID and verified Podium release certificate; install it over v1.0.1 without uninstalling. Existing-user migration has not been independently device-tested. Source, upstream credits and GPLv3 notices remain in this repository.'

  publish-desktop:
    needs: build-signed-release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the tested desktop source and successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kaizen-flims/Podium-Air/actions/runs/38621132271 > tested-run.json
          jq -e '.conclusion == "success" and .head_sha == "fdb459cd999da9a03858b40ba39c9e8043dce988"' tested-run.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38621132271
          artifact-ids: 11922133561,11921453857,11922253672,11922338367,11922008704,11922631631,11921654414,11922657216,11922274342
          merge-multiple: true
          path: desktop-release
      - name: Publish Windows and macOS together, separately from Android
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=desktop-v1.0.1-beta1
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Desktop release already exists; leaving it unchanged.'
            exit 0
          fi
          cd desktop-release
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 9
          for file in \
            Podium-Air-1.0.1-beta1-windows-x64-setup.exe \
            Podium-Air-1.0.1-beta1-windows-x64.msi \
            Podium-Air-1.0.1-beta1-windows-x64-portable.zip \
            Podium-Air-1.0.1-beta1-macos-arm64.dmg \
            Podium-Air-1.0.1-beta1-macos-arm64.pkg \
            Podium-Air-1.0.1-beta1-macos-arm64.zip \
            Podium-Air-1.0.1-beta1-macos-x64.dmg \
            Podium-Air-1.0.1-beta1-macos-x64.pkg \
            Podium-Air-1.0.1-beta1-macos-x64.zip; do
            test -s "$file"
          done
          sha256sum Podium-Air-* > SHA256SUMS.txt
          cat > ../desktop-notes.md <<'NOTES'
          First native Podium Air desktop beta, using the real upstream shared Kotlin/Compose implementation.

          Windows: download the x64 setup EXE; MSI and portable ZIP are alternatives.
          macOS: choose arm64 for Apple Silicon (M1 and newer), or x64 for Intel. Download the DMG; PKG and app ZIP are alternatives.

          All platform unit tests, strict Automix native/model initialization and packaging checks passed in run 38621132271 at fdb459cd999da9a03858b40ba39c9e8043dce988. Interactive desktop playback/sign-in/media-control testing is still pending. Windows packages are unsigned; macOS packages are unsigned and unnotarized. This beta is separate from the stable Android update.

          Podium Air branding and maintenance: Prem Das aka Kaizen. Derived from BitChord by Kushagra Singh and contributors. GPLv3 source, legal notices, provenance and verification limits are in the tagged repository and bundled notices. Existing Android font/model and native dependency distribution provenance remains under review.
          NOTES
          gh release create "$tag" Podium-Air-* SHA256SUMS.txt \
            --target fdb459cd999da9a03858b40ba39c9e8043dce988 \
            --title 'Podium Air Desktop v1.0.1 Beta 1 — Windows & macOS' \
            --notes-file ../desktop-notes.md --prerelease --latest=false --draft
          gh release edit "$tag" --draft=false --latest=false
