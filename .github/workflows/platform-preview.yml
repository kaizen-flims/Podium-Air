name: Podium Air platform previews
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_lyrics_checks:
        description: Run external Genius provider checks (requires live network access)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: platform-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    env:
      RUN_LIVE_LYRICS_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_lyrics_checks && 'true' || 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Restore persistent separate audit signing key
        id: audit-signing-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: podium-air-android-audit-signing-v1
          fail-on-cache-miss: true
      - name: Verify persistent audit signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.android/debug.keystore"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey > audit-certificate.der
          sha256sum audit-certificate.der | cut -d ' ' -f 1 > audit-expected-certificate.txt
      - name: Verify preserved identity and resource integrity
        run: |
          python3 tools/verify_identity.py
          python3 tools/verify_android_audit.py
          python3 tools/test_intel_beat_model.py
      # Fresh JVMs keep R8's retained heap away from the next APK packager.
      # A single worker also avoids packaging all ABI splits concurrently.
      - name: Android unit tests
        run: bash gradlew :app:testDevDebugUnitTest --no-daemon --no-parallel --max-workers=1 --stacktrace
      - name: Build optimized isolated audit APK
        run: >-
          bash gradlew :app:assembleProdAudit --no-daemon --no-parallel --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true'
          --stacktrace
      - name: Verify audit APK identity and independent certificate
        shell: bash
        run: |
          set -euxo pipefail
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          aapt="$(dirname "$apksigner")/aapt"
          apk=$(find app/build/outputs/apk/prod/audit -name '*universal*.apk' | head -1)
          test -n "$apk"
          reports=dist/android-audit-diagnostics
          mkdir -p "$reports"
          cp "$apk" "$reports/Podium-Air-Audit-2-v1.8.1.apk"
          cp audit-expected-certificate.txt "$reports/"
          "$aapt" dump badging "$apk" | tee "$reports/audit-apk-badging.txt"
          "$apksigner" verify --print-certs "$apk" | tee "$reports/audit-signing-verification.txt"
          "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$reports/audit-manifest.txt"
          grep -Fq "package: name='com.podium.air.audit2'" "$reports/audit-apk-badging.txt"
          grep -Fq "application-label:'Podium Air Audit 2'" "$reports/audit-apk-badging.txt"
          grep -Fqi "$(cat audit-expected-certificate.txt)" "$reports/audit-signing-verification.txt"
          if grep -Fqi 'fecd7966b7cff88be9aeb7be70bfc10b588d43569c8bf25c447dd4ae4d1d95a2' "$reports/audit-signing-verification.txt"; then
            echo 'Audit APK must never use the production signing certificate'
            exit 1
          fi
          grep -Fq 'com.podium.air.audit2.fileprovider' "$reports/audit-manifest.txt"
          mkdir -p dist/android-audit
          cp "$reports/"* dist/android-audit/
          sha256sum dist/android-audit/*.apk > dist/android-audit/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-android-audit
          path: dist/android-audit/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: podium-air-android-audit-UNVERIFIED-diagnostics
          path: dist/android-audit-diagnostics/
          if-no-files-found: warn
      - name: Validate unsigned production build independently
        run: >-
          bash gradlew :app:assembleProdRelease --no-daemon --no-parallel --max-workers=1
          -Pkotlin.compiler.execution.strategy=in-process
          '-Dorg.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true'
          --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podium-air-android-test-reports
          path: app/build/reports/tests/
  windows:
    if: ${{ always() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Tests and Windows packages
        shell: pwsh
        run: .\gradlew.bat :shared:jvmTest :sharedUi:jvmTest :desktopApp:test :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable --stacktrace
      - name: Collect portable app and verify native libraries
        shell: pwsh
        run: |
          $app = 'desktopApp/build/compose/binaries/main/app/Podium Air'
          if (!(Test-Path "$app/Podium Air.exe")) { throw 'Missing Podium Air launcher' }
          $jar = Get-ChildItem "$app/app/desktopApp*.jar" | Select-Object -First 1
          $entries = & jar tf $jar.FullName
          if (!($entries -match 'native/bitchord_smtc.dll')) { throw 'Missing Windows media controls' }
          if (!($entries -match 'native/bitchord_analysis.dll')) { throw 'Missing Automix analyser' }
          if (!($entries -match 'models/.*\.onnx')) { throw 'Missing Automix models' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi dist/Podium-Air-1.0.1-beta1-windows-x64.msi
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe dist/Podium-Air-1.0.1-beta1-windows-x64-setup.exe
          Compress-Archive -Path "$app/*" -DestinationPath 'dist/Podium-Air-1.0.1-beta1-windows-x64-portable.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-windows-setup-preview
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-windows-msi-preview
          path: dist/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-windows-portable-preview
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podium-air-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
  macos:
    if: ${{ always() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Tests and unsigned macOS packages
        run: bash gradlew :shared:jvmTest :sharedUi:jvmTest :desktopApp:test :desktopApp:packageDmg :desktopApp:packagePkg :desktopApp:createDistributable --stacktrace
      - name: Verify bundle and collect packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          app='desktopApp/build/compose/binaries/main/app/Podium Air.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")" = 'com.podium.air.desktop'
          jar=$(find "$app/Contents/app" -name 'desktopApp*.jar' | head -1)
          jar tf "$jar" > bundle-entries.txt
          grep -q 'models/.*\.onnx' bundle-entries.txt
          grep -q 'native/libbitchord_analysis.dylib' bundle-entries.txt
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "dist/Podium-Air-1.0.1-beta1-macos-$ARCH.dmg"
          cp desktopApp/build/compose/binaries/main/pkg/*.pkg "dist/Podium-Air-1.0.1-beta1-macos-$ARCH.pkg"
          ditto -c -k --keepParent "$app" "dist/Podium-Air-1.0.1-beta1-macos-$ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-macos-${{ matrix.arch }}-dmg-preview
          path: dist/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-macos-${{ matrix.arch }}-pkg-preview
          path: dist/*.pkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-macos-${{ matrix.arch }}-app-preview
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podium-air-macos-${{ matrix.arch }}-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
