name: Podium Air TV audit
on:
  push:
    branches: [codex/tv-audit-preview]
  pull_request:
    paths: ['tv/**', 'settings.gradle.kts', '.github/workflows/tv.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: podium-tv-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tv-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'cmake;3.22.1'
      - name: Reuse audit signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: podium-tv-audit-signing-v1
      - name: Test and build optimized isolated TV APK
        run: bash gradlew -PpodiumTv=true :tv:testDevReleaseUnitTest :tv:assembleDevRelease --stacktrace --max-workers=2
      - name: Stage tester package
        run: |
          mkdir -p tv-audit-artifact
          cp tv/build/outputs/apk/dev/release/*universal*.apk tv-audit-artifact/Podium-Air-TV-Audit-1.apk
          cp LICENSE tv-audit-artifact/LICENSE.txt
          cp tv/AUDIT.md tv-audit-artifact/AUDIT.md
          cd tv-audit-artifact
          sha256sum Podium-Air-TV-Audit-1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: podium-air-tv-audit1
          path: tv-audit-artifact/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: podium-tv-reports
          path: tv/build/reports/
